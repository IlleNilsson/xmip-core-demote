# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-demote"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-demote"
description = "Demotion from Xmip Message Context into structured messages and executable artifacts."

[features]
# The demotion's code and what it is built on. Without it the crate is the
# Demote unit's declaration alone, which configure reads the standard module
# by.
default = ["units"]
units = ["dep:context", "dep:contract", "dep:path"]

[dependencies]
# The unit's declaration and the stage it runs at.
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main", optional = true }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", optional = true }
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main", optional = true }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]
# Only the tests build a Stream to rewrite.
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[profile.dev.package."*"]
opt-level = 3
